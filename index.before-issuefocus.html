<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HerdLink — Хяналтын самбар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1E3326;
  --ink-2:#4A5A4F;
  --surface:rgba(255,255,255,.92);
  --surface-solid:#FFFFFF;
  --line:rgba(30,51,38,.12);
  --forest:#2F6B3F;
  --forest-ink:#FFFFFF;
  --ok:#5F7366;
  --warn:#B97B07;
  --warn-bg:#FFF3D6;
  --alarm:#B9281D;
  --alarm-bg:#FDE3DF;
  --off:#8C948D;
  --sky-top:#D5E8EE;
  --sky-bottom:#EDF3DD;
  --shadow:0 6px 24px rgba(30,51,38,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EEF2EA;--ink-2:#B8C3B9;--surface:rgba(24,34,48,.9);--surface-solid:#1B2534;
    --line:rgba(238,242,234,.14);--forest:#7CC28A;--forest-ink:#0F1B12;--ok:#A5B7AA;
    --warn:#F2B53A;--warn-bg:#3A2E12;--alarm:#FF6B5E;--alarm-bg:#40191A;--off:#7F8A86;
    --sky-top:#0F1A2C;--sky-bottom:#25314A;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF2EA;--ink-2:#B8C3B9;--surface:rgba(24,34,48,.9);--surface-solid:#1B2534;
  --line:rgba(238,242,234,.14);--forest:#7CC28A;--forest-ink:#0F1B12;--ok:#A5B7AA;
  --warn:#F2B53A;--warn-bg:#3A2E12;--alarm:#FF6B5E;--alarm-bg:#40191A;--off:#7F8A86;
  --sky-top:#0F1A2C;--sky-bottom:#25314A;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark;
}
:root[data-phase="dusk"]{--sky-top:#F1D8C6;--sky-bottom:#ECE5D2}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
  background-color:var(--sky-bottom);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .8s ease;
}
#stage{position:fixed;inset:0;touch-action:none;z-index:2;transition:opacity .22s ease}
#stage.fade{opacity:0}
body.grid #stage{pointer-events:none}
#labels{transition:opacity .25s}
body.grid #labels,body.grid .mlist{opacity:0;pointer-events:none;visibility:hidden}
body.grid .hint{display:none}

/* arrows */
.nav-arrow{position:fixed;top:50%;z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;transform:translateY(-50%);transition:opacity .3s, transform .3s}
.nav-arrow.next{right:-12px;padding-right:12px}
.nav-arrow.prev{left:-12px;padding-left:12px}
.nav-arrow:hover{transform:translateY(-50%) scale(1.06)}
body.grid .nav-arrow.next,body:not(.grid) .nav-arrow.prev,body.panel-open .nav-arrow{opacity:0;pointer-events:none}

/* grid view */
.gridview{position:fixed;inset:0;z-index:4;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 0px) 0 110px;background:var(--g-bg);color:var(--g-ink);
  opacity:0;visibility:hidden;transform:translateX(56px);transition:opacity .3s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s,padding-right .45s;
  --g-bg:#E9EEE7;--g-panel:#FFFFFF;--g-line:#DCE3DA;--g-ink:#15241B;--g-ink2:#4E5E54;--g-mut:#6E7D73;--g-grid:rgba(21,36,27,.08);
  --c-blue:#2F7FC1;--c-water:#3C97CF;--c-green:#2F8A5B;--c-amber:#C98A0B;--c-red:#C9372C;--c-ochre:#D9A23A;--c-terra:#C2593A;--c-cream:#D9CFB5;--c-brown:#8A6343;--c-dark:#4A3A2E;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
:root[data-theme="dark"] .gridview{--g-bg:#0B121C;--g-panel:#0F1926;--g-line:#1C2838;--g-ink:#E6EDF5;--g-ink2:#A9B7C6;--g-mut:#7F90A3;--g-grid:rgba(200,215,235,.07);
  --c-blue:#5B9BD5;--c-water:#4FA7E0;--c-green:#4CC27A;--c-amber:#E8A93A;--c-red:#E5483B;--c-cream:#E8E1CD}
body.grid .gridview{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease .12s,transform .5s cubic-bezier(.2,.8,.2,1) .12s,visibility 0s,padding-right .45s}
body.grid.panel-open .gridview{padding-right:392px}
body.grid .top{opacity:0;pointer-events:none}
.ghd{position:relative;display:flex;align-items:center;gap:0;padding:18px 28px 20px;border-bottom:1px solid var(--g-line);overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--g-panel) 60%,transparent),var(--g-bg))}
.ghd .hills{position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;opacity:.55}
.ghd .ttl{position:relative;padding-right:24px;margin-right:4px;border-right:1px solid var(--g-line)}
.ghd .ttl b{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.ghd .ttl small{font:500 12px var(--mono);letter-spacing:.05em;color:var(--g-mut);text-transform:uppercase}
.kpis{position:relative;display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpi{padding:0 20px;border-right:1px solid var(--g-line);white-space:nowrap}
.kpi:last-child{border-right:0}
.kpi small{display:block;font:500 12px var(--mono);letter-spacing:.05em;color:var(--g-mut);text-transform:uppercase}
.kpi b{display:block;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi b.cold{color:var(--c-blue)} .kpi b.good{color:var(--c-green)} .kpi b.amb{color:var(--c-amber)} .kpi b.bad{color:var(--c-red)}
.kpi.btn{cursor:pointer;background:none;border:0;border-right:1px solid var(--g-line);text-align:left;font:inherit;color:inherit}
.clock{position:relative;text-align:right;padding-left:20px}
.clock b{display:block;font:500 28px var(--mono);color:var(--c-blue)}
.clock small{font-size:12px;color:var(--g-mut)}
.galerts{max-width:none;margin:16px 28px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.galerts .allok-banner{display:none}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:16px 28px 0;background:var(--g-line);border:1px solid var(--g-line);border-radius:14px;overflow:hidden}
.pnl{background:var(--g-panel);padding:16px 18px 14px;display:flex;flex-direction:column;min-height:240px;cursor:pointer;position:relative;transition:background .2s}
.pnl:hover{background:color-mix(in srgb,var(--g-panel) 92%,var(--g-ink))}
.pnl.sel{box-shadow:inset 0 0 0 2px var(--c-green)}
.pnl.alarm{box-shadow:inset 0 0 0 2px var(--c-red);animation:pnlA 1.6s ease-in-out infinite}
.pnl.warn{box-shadow:inset 0 0 0 2px var(--c-amber)}
@keyframes pnlA{50%{box-shadow:inset 0 0 0 2px var(--c-red),inset 0 0 40px color-mix(in srgb,var(--c-red) 22%,transparent)}}
.pnl.off{opacity:.78}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph2 h3{margin:0;font-size:19px;font-weight:600}
.ph2 p{margin:3px 0 0;font:500 12px var(--mono);letter-spacing:.04em;color:var(--c-blue);text-transform:uppercase}
.badge{font:600 11px var(--mono);letter-spacing:.1em;padding:3px 8px;border:1px solid var(--c-green);color:var(--c-green);border-radius:3px;white-space:nowrap}
.badge.warn{border-color:var(--c-amber);color:var(--c-amber)}
.badge.alarm{background:var(--c-red);border-color:var(--c-red);color:#fff}
.badge.off{border-color:var(--g-mut);color:var(--g-mut)}
.viz{flex:1;display:flex;align-items:center;gap:14px;margin-top:10px;min-height:0}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--mono);font-size:11px;fill:var(--g-mut)}
.lg2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--g-ink2)}
.lg2 span{display:flex;align-items:center;gap:6px}
.lg2 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg2 i.ln{width:14px;height:2px;border-radius:1px}
.big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.big.warn{color:var(--c-amber)} .big.alarm{color:var(--c-red)}
.st2{display:flex;flex-direction:column;gap:10px;min-width:120px}
.st2 small{display:block;font:500 12px var(--mono);letter-spacing:.03em;color:var(--g-mut);text-transform:uppercase}
.st2 b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st2 b.alarm{color:var(--c-red)} .st2 b.warn{color:var(--c-amber)}
.tip2{position:absolute;pointer-events:none;background:var(--g-ink);color:var(--g-panel);font:500 11.5px var(--mono);padding:4px 7px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s}
.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cam{position:relative;border-radius:6px;overflow:hidden;background:#0C120F;aspect-ratio:4/3}
.cam svg{width:100%;height:100%}
.cam span{position:absolute;left:6px;bottom:4px;font:500 11px var(--mono);color:#CFE3D6;letter-spacing:.04em}
.cam em{position:absolute;right:6px;top:5px;font:600 9px var(--mono);color:#fff;font-style:normal;display:flex;align-items:center;gap:4px}
.cam em::before{content:"";width:6px;height:6px;border-radius:50%;background:#E5483B;animation:blink 1s steps(2,start) infinite}
.camlist{margin-top:10px;font-size:13px;color:var(--g-ink2);display:grid;gap:4px}
.camlist b{color:var(--g-ink)} .camlist .alarm{color:var(--c-red);font-weight:600}
.offbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--g-mut);text-align:center;font-size:14px}
.offbox svg{width:84px !important;flex:none}
.offbox button{border:1px solid var(--g-line);background:transparent;color:var(--g-ink);font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer}
@media (max-width:720px){ .nav-arrow,.nav-arrow:hover{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:none;width:48px;height:48px} .nav-arrow.prev,.nav-arrow.next{left:auto;right:14px;padding:0} }
@media (max-width:1100px){ .ggrid{grid-template-columns:repeat(2,minmax(0,1fr))} .ghd .ttl b{font-size:24px} .kpi b{font-size:20px} }
@media (max-width:720px){ .ggrid{grid-template-columns:minmax(0,1fr);margin:12px 10px 0} .galerts{margin:12px 10px 0} .ghd{flex-wrap:wrap;padding:14px 14px 12px} .ghd .ttl{border-right:0;width:100%;padding-bottom:8px} .clock{display:none} .kpis{width:100%} .kpi{padding:0 14px 0 0;margin-right:14px} .pnl{min-height:260px} }
@media (prefers-reduced-motion:reduce){.gridview,body.grid .gridview,#stage{transition:none}}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 8%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 44% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 12%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 79% 26%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 91% 9%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 40%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 95% 44%,#fff 50%,transparent 51%)}
:root[data-phase="night"] #stars{opacity:.7}

/* top bar */
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--ink-2)}
.counts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.count{border:0;font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.count i{width:8px;height:8px;border-radius:50%;display:inline-block}
.count.warn{background:var(--warn-bg);color:var(--warn)}
.count.alarm{background:var(--alarm-bg);color:var(--alarm)}
.weather{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wx{border:0;font:inherit;color:var(--ink);background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
.wx .t{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.wx .d{display:flex;flex-direction:column;font-size:13px;color:var(--ink-2);line-height:1.35}
.wx .d strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.alert{border:0;font:inherit;font-size:13px;font-weight:600;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);cursor:pointer;max-width:290px;text-align:left;display:flex;gap:8px;align-items:flex-start}
.alert svg{flex:none;margin-top:1px}

/* tile labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;font:inherit;cursor:pointer;
  transform:translate(-50%,6px);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 11px 7px 10px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;white-space:nowrap;transition:box-shadow .2s, outline-color .2s;outline:2px solid transparent;will-change:transform}
.tag .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag .n{font-size:13px;font-weight:500;color:var(--ink-2)}
.tag .m{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tag.warn{background:var(--warn-bg)} .tag.warn .m{color:var(--warn)}
.tag.alarm{background:var(--alarm-bg)} .tag.alarm .m{color:var(--alarm)}
.tag.off .m{color:var(--off);font-weight:600}
.tag.sel{outline-color:var(--forest)}
.tag.alarm .dot{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.tag:focus-visible,.count:focus-visible,.wx:focus-visible,.alert:focus-visible,button:focus-visible{outline:3px solid var(--forest);outline-offset:2px}

/* side panel / bottom sheet */
.panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:360px;
  background:var(--surface-solid);color:var(--ink);border-radius:22px;box-shadow:0 12px 40px rgba(20,35,25,.22);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.ph{padding:20px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:6px;padding:3px 9px;border-radius:999px;background:rgba(95,115,102,.12);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.alarm{background:var(--alarm-bg);color:var(--alarm)}
.status.off{color:var(--off)}
.close{border:0;background:rgba(30,51,38,.07);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center}
:root[data-theme="dark"] .close{background:rgba(255,255,255,.08)}
.pb{padding:4px 20px 20px;overflow:auto;flex:1}
.lead{font-size:15px;line-height:1.5;color:var(--ink-2);margin:4px 0 14px}
.rows{display:grid;gap:0;margin:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row dt{font-size:14px;color:var(--ink-2)}
.row dd{margin:0;font-size:16px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row dd.warn{color:var(--warn)} .row dd.alarm{color:var(--alarm)}
.spark{margin:16px 0 4px}
.spark small{font-size:13px;color:var(--ink-2)}
.spark svg{display:block;width:100%;height:64px;margin-top:6px}
.note{font-size:14px;line-height:1.5;background:rgba(47,107,63,.08);border-radius:14px;padding:12px 14px;margin-top:14px}
.note b{display:block;font-size:13px;color:var(--forest);margin-bottom:2px}
.pf{padding:14px 20px 20px;border-top:1px solid var(--line)}
.primary{width:100%;border:0;font:inherit;font-size:16px;font-weight:600;background:var(--forest);color:var(--forest-ink);border-radius:14px;padding:14px 16px;cursor:pointer}
.ask{display:flex;gap:8px;margin-top:14px}
.ask input{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;border-radius:999px;padding:6px 10px;cursor:pointer}
.fc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fc div{border-radius:14px;background:rgba(30,51,38,.05);padding:10px;font-size:13px;color:var(--ink-2)}
:root[data-theme="dark"] .fc div{background:rgba(255,255,255,.05)}
.fc strong{display:block;font-size:17px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.fc .w strong{color:var(--warn)}

/* bottom-left controls */
.dock{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;padding:7px 10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}
.hint{font-size:13px;color:var(--ink-2)}
/* UX pass: search, user menu, next step, states, modal, settings */
#vignette{display:none !important}
.srch{position:relative;flex:1;max-width:420px;margin:2px 24px 0;align-self:flex-start}
.srch input{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink);border-radius:12px;padding:11px 48px 11px 40px;box-shadow:var(--shadow)}
.srch>svg{position:absolute;left:13px;top:13px;color:var(--ink-2)}
.srch .qr{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface-solid);border-radius:12px;box-shadow:0 12px 30px rgba(20,35,25,.22);overflow:hidden;z-index:9}
.sres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button:focus-visible{background:rgba(47,107,63,.08)}
.sres b{font-weight:600} .sres small{display:block;font-size:13px;color:var(--ink-2)}
.sres .tagno{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);margin-left:auto;white-space:nowrap}
.sres p{margin:0;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.uwrap{position:relative;margin-left:12px}
.ubtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--forest);color:var(--forest-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}

/* bento data page: one visual per module, size follows importance */
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(200px,auto);grid-auto-flow:dense;gap:16px;margin:18px 28px 0;background:transparent;border:0;border-radius:0;overflow:visible}
.ggrid .pnl{position:relative;display:flex;flex-direction:column;min-height:0;padding:0;border-radius:20px;border:1px solid var(--g-line);background:var(--g-panel);overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s;animation:none}
.ggrid .pnl:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--g-ink) 30%,var(--g-line))}
.ggrid .pnl:focus-visible{outline:3px solid var(--g-ink);outline-offset:2px}
.ggrid .pnl.sel{border-color:var(--g-ink)}
.ggrid .pnl.alarm{border-color:var(--c-red);animation:bAl 1.8s ease-in-out infinite}
.ggrid .pnl.warn{border-color:var(--c-amber)}
@keyframes bAl{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c-red) 25%,transparent)}}
.ggrid .pnl.off{opacity:.72}
.b-water{grid-row:span 2} .b-camera{grid-column:span 2} .b-gps{grid-column:span 2}
.art{position:relative;flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;padding:22px 22px 0;
  background-image:radial-gradient(color-mix(in srgb,var(--g-ink) 10%,transparent) 1px,transparent 1.3px);background-size:14px 14px;background-position:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 60% at 50% 45%,var(--glow,transparent),transparent 72%);pointer-events:none}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--g-panel));pointer-events:none}
.art>*{position:relative;z-index:1}
.pnl.ok{--glow:color-mix(in srgb,var(--c-green) 14%,transparent)} .pnl.warn{--glow:color-mix(in srgb,var(--c-amber) 26%,transparent)} .pnl.alarm{--glow:color-mix(in srgb,var(--c-red) 32%,transparent)}
.cap{padding:14px 22px 20px;position:relative;z-index:1}
.cap h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.cap .line{margin:4px 0 0;font-size:15px;color:var(--g-ink2);line-height:1.4}
.pnl.alarm .cap .line{color:var(--c-red);font-weight:600} .pnl.warn .cap .line{color:var(--c-amber);font-weight:600}
.stat{position:absolute;top:14px;right:14px;z-index:3;display:block;width:30px;height:30px}
.big2{font-family:"Golos Text",system-ui,sans-serif;font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,color-mix(in srgb,var(--g-ink) 55%,transparent),color-mix(in srgb,var(--g-ink) 12%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--g-ink) 35%,transparent)}
.pnl.alarm .big2{background-image:linear-gradient(180deg,color-mix(in srgb,var(--c-red) 85%,transparent),color-mix(in srgb,var(--c-red) 25%,transparent));-webkit-text-stroke-color:color-mix(in srgb,var(--c-red) 60%,transparent)}
.pnl.warn .big2{background-image:linear-gradient(180deg,color-mix(in srgb,var(--c-amber) 85%,transparent),color-mix(in srgb,var(--c-amber) 25%,transparent));-webkit-text-stroke-color:color-mix(in srgb,var(--c-amber) 60%,transparent)}
.unit{font-size:22px;font-weight:700;color:var(--g-ink2);margin-left:6px}
.fence-art{display:flex;flex-direction:column;align-items:center;width:100%}
.fence-art .pulse{width:100%;max-width:300px;height:34px;margin-top:6px}
.pulse .run{stroke-dasharray:26 600;animation:run 1.8s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-626}}
.species{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:14px}
.species div{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--g-ink2);font:600 13px var(--mono)}
.species svg{width:34px;height:34px;color:var(--g-ink)}
.dwrap{display:flex;align-items:center;justify-content:center;gap:20px;width:100%}
.donut2{width:min(180px,55%);flex:none;overflow:visible}
.donut2 path{transition:transform .2s;transform-origin:70px 70px}
.donut2 path:hover{transform:scale(1.05)}
.dleg{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.dleg li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--g-ink)}
.dleg i{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.dleg b{margin-left:auto;padding-left:12px;font:600 14px var(--mono);color:var(--g-ink2)}
.segs{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;width:100%;margin-top:14px}
.segs i{height:22px;border-radius:3px;background:color-mix(in srgb,var(--g-ink) 10%,transparent)}
.segs i.on{background:var(--c-green)} .pnl.warn .segs i.on{background:var(--c-amber)} .pnl.alarm .segs i.on{background:var(--c-red)}
.scale{position:relative;width:100%;max-width:280px;height:8px;border-radius:4px;margin:18px auto 4px;background:linear-gradient(90deg,#6AA9FF,#C9D6E5 66%,#F2B544)}
.scale b{position:absolute;top:-6px;width:4px;height:20px;border-radius:2px;margin-left:-2px}
.scalel{display:flex;justify-content:space-between;max-width:280px;margin:0 auto;font:500 12px var(--mono);color:var(--g-ink2)}
.gcount{display:flex;gap:18px;margin-top:10px;font:600 15px var(--mono);color:var(--g-ink2)}
.gcount span{display:flex;align-items:center;gap:6px}
.drone-art{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--g-ink2)}
.drone-art button{border:1px solid var(--g-line);background:transparent;color:var(--g-ink);font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:8px 14px;cursor:pointer}
.b-camera .cams{gap:10px}
.b-camera .art{padding-top:56px}
.b-gps .art svg{max-height:240px;width:auto !important;max-width:100%}
@media (max-width:1100px){ .ggrid{grid-template-columns:repeat(2,minmax(0,1fr))} .b-gps{grid-column:span 2} }
@media (max-width:720px){ .ggrid{grid-template-columns:minmax(0,1fr);margin:12px 10px 0;grid-auto-rows:auto} .b-water{grid-row:auto} .b-camera,.b-gps{grid-column:auto} .art{min-height:170px} .b-water .art svg{width:min(140px,50%) !important} }
@media (prefers-reduced-motion:reduce){ .pulse .run,.ggrid .pnl.alarm{animation:none} }

.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.gt{border:1px solid var(--g-line);background:color-mix(in srgb,var(--g-panel) 70%,var(--g-bg));border-radius:14px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--g-ink);font:inherit;font-size:14px;font-weight:700;transition:transform .2s,border-color .2s}
.gt:hover,.gt:focus-visible,.gt.on{transform:translateY(-2px);border-color:var(--g-ink);outline:none}

/* ===== fit-to-screen grid: whole dashboard in one viewport, no vertical scroll =====

   chart or picture scales to the card instead of pushing the card taller. */
body .gridview{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}

.ggrid .pnl[data-id="env"]{grid-area:env} .ggrid .pnl[data-id="camera"]{grid-area:camera} .ggrid .pnl[data-id="feed"]{grid-area:feed}

/* ===== left rail navigation (solid, not glass) ===== */
:root{--rail-w:84px;--rail-bg:#121417;--rail-ink:#8B919B;--rail-on:#E4F0E5;--rail-on-ink:#17321F}
:root[data-theme="dark"]{--rail-bg:#17233A;--rail-ink:#8F97A6;--rail-on:#E9ECF2;--rail-on-ink:#131E30}
.rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:31;width:56px;max-height:calc(100vh - 28px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  padding:10px 0;background:var(--rail-bg);border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 12px 32px rgba(10,14,20,.28),inset 0 0 0 1px rgba(255,255,255,.06);transition:opacity .3s,transform .45s cubic-bezier(.22,.9,.22,1)}
.rail::-webkit-scrollbar{display:none}
.rail .logo{flex:none;width:40px;height:40px;display:grid;place-items:center;color:#fff;font:800 19px "Golos Text",system-ui,sans-serif;letter-spacing:-.04em;margin-bottom:4px}
.rail .logo i{display:block;width:6px;height:6px;border-radius:50%;background:#5CC48A;margin:-14px 0 0 1px}
.rail .sep{flex:none;width:22px;height:1px;background:rgba(255,255,255,.12);margin:5px 0}
.rail .ri{flex:none;position:relative;z-index:1;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--rail-ink);display:grid;place-items:center;cursor:pointer;transition:color .3s}
.rail .ri svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease-out;will-change:transform}
.rail .ri:hover,.rail .ri:focus-visible{color:#fff}
.rail .ri:focus-visible{outline:2px solid #fff;outline-offset:1px}
.rail .ri[aria-current="true"]{color:var(--rail-on-ink)}
.rail .ri.off{opacity:.42}
.rail .rav{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#3E9A63,#24613D);color:#fff;font:800 13px "Golos Text",system-ui,sans-serif;transition:transform .18s ease-out;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.rail .rav.v{background:linear-gradient(140deg,#D9A23A,#9C6A1C)}
.rail .ri .sd{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--rail-bg);display:none}
.rail .ri .sd.warn{display:block;background:#F2B544} .rail .ri .sd.alarm{display:block;background:#E5483B;animation:sdP 1.4s ease-in-out infinite}
@keyframes sdP{50%{box-shadow:0 0 0 2px var(--rail-bg),0 0 0 6px rgba(229,72,59,.35)}}
.rail-ind{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--rail-on);opacity:0;z-index:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.34,1.42,.5,1),opacity .25s}
.rail-tip{position:fixed;left:82px;top:0;z-index:33;pointer-events:none;background:var(--rail-bg);color:#fff;font:600 12.5px "Golos Text",system-ui,sans-serif;padding:6px 10px;border-radius:9px;white-space:nowrap;
  opacity:0;transform:translate(-6px,-50%);transition:opacity .2s,transform .4s cubic-bezier(.34,1.42,.5,1),top .4s cubic-bezier(.34,1.42,.5,1);box-shadow:0 6px 18px rgba(10,14,20,.25)}
.rail-tip::before{content:"";position:absolute;left:-4px;top:50%;width:9px;height:9px;background:inherit;transform:translateY(-50%) rotate(45deg);border-radius:2px}
.rail-tip.on{opacity:1;transform:translate(0,-50%)}
/* everything else moves right of the rail */
.top{left:var(--rail-w)} body .gridview{left:var(--rail-w)} .settings{left:var(--rail-w)} .modcard{left:var(--rail-w)}
.dock{left:calc(var(--rail-w) + 4px)} .dock .seg{display:none}
.nav-arrow{display:none !important}
.modtabs{visibility:hidden}
.modal{z-index:40}
/* ===== motion: content enters blurred and settles, in a stagger ===== */
@keyframes hlIn{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(8px)}}
@keyframes hlFade{from{opacity:0;filter:blur(6px)}}
.gridview.enter .ghd .kpi,.gridview.enter .ghd .ttl,.gridview.enter .ghd .clock,.gridview.enter .galerts>*,.gridview.enter .ggrid>.pnl{animation:hlIn .62s cubic-bezier(.22,.9,.22,1) both;animation-delay:calc(var(--i,0) * 45ms + 60ms)}

.settings:not([hidden]) .smain>*,.settings:not([hidden]) .snav>*{animation:hlIn .5s cubic-bezier(.22,.9,.22,1) both}
.settings:not([hidden]) .smain>*:nth-child(2),.settings:not([hidden]) .snav>*:nth-child(2){animation-delay:40ms} .settings:not([hidden]) .smain>*:nth-child(3),.settings:not([hidden]) .snav>*:nth-child(3){animation-delay:80ms}
.settings:not([hidden]) .smain>*:nth-child(4),.settings:not([hidden]) .snav>*:nth-child(4){animation-delay:120ms} .settings:not([hidden]) .smain>*:nth-child(n+5),.settings:not([hidden]) .snav>*:nth-child(n+5){animation-delay:160ms}

.sres>*:nth-child(2){animation-delay:35ms} .sres>*:nth-child(3){animation-delay:70ms} .sres>*:nth-child(4){animation-delay:105ms} .sres>*:nth-child(5){animation-delay:140ms} .sres>*:nth-child(n+6){animation-delay:175ms}

/* fence: current runs along the wire */
.c-fence,.c-gate,.c-env,.c-feed,.c-reg,.c-drone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.c-fence{padding:10px 10px 50px}
.c-fence svg{width:100%;height:100%}
body .ggrid .pnl[data-id="water"] .cap{display:none}
.c-water .pct small{white-space:nowrap}
body .ggrid .c-g3{padding:12px 12px 48px}
body .ggrid .c-g3 .ring{max-width:50%}

body .ggrid .c-g3 .flowc{padding-top:26px;gap:4px;justify-content:flex-start}
body .ggrid .c-g3 .fl{font-size:12px;gap:6px} body .ggrid .c-g3 .fl b{font-size:16px} body .ggrid .c-g3 .fl i{width:20px;height:20px}
body .ggrid .c-g3 .flowc{padding-top:22px;gap:3px}
@container (max-height:200px){ body .ggrid .c-g3 .fl i{width:18px;height:18px;font-size:11px} body .ggrid .c-g3 .fl b{font-size:14px} body .ggrid .c-g3 .fl{font-size:11px} .c-g3 .ctr b{white-space:normal;font-size:9.5px;line-height:1.1} }
.c-e3 .etop .ix-tabs{flex-wrap:nowrap}
.c-e3 .etop .ix-tabs button{padding:4px 8px;font-size:11.5px}
.c-e3 .now{min-width:0;overflow:hidden;text-overflow:ellipsis}
@container (max-width:360px){ .c-e3 .now small{display:none} }
@container (max-height:190px){ .c-g3 .ctr b{font-size:10px} .c-g3 .ctr small{font-size:9.5px} }
.c-fence .fpl{fill:none;stroke:#FFE07A;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 34;animation:fpl 1.3s linear infinite;filter:drop-shadow(0 0 3px #FFD34D) drop-shadow(0 0 7px rgba(255,211,77,.7))}
@keyframes fpl{to{stroke-dashoffset:-37}}
.c-fence .seg{fill:none;stroke:rgba(225,236,230,.55);stroke-width:1.6}
.c-fence .seg.hit{stroke:transparent;stroke-width:16;cursor:help}
.c-fence .seg.bad{stroke:#FF6B5E;stroke-dasharray:5 4}
.c-fence .spark{fill:#FF6B5E;animation:spk .5s steps(2) infinite}
@keyframes spk{50%{opacity:.15}}
/* gates swing */
.c-gate{padding:14px 12px 48px;align-items:flex-end;gap:2%}
body .ggrid .c-gate .gate2.gseg{all:unset;box-sizing:border-box;flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:10px;padding:4px 0 2px;transition:background .2s}
body .ggrid .c-gate .gate2.gseg:hover,body .ggrid .c-gate .gate2.gseg.on{background:rgba(255,255,255,.35);outline:0;transform:none}
:root[data-theme="dark"] body .ggrid .c-gate .gate2.gseg:hover,:root[data-theme="dark"] body .ggrid .c-gate .gate2.gseg.on{background:rgba(255,255,255,.07)}
.c-gate svg{width:100%;height:auto;overflow:visible}
.c-gate .post{fill:#7A5B3E} :root[data-theme="dark"] .c-gate .post{fill:#B08A62}
.c-gate .leaf{transform-box:fill-box;transform-origin:0 50%;transition:transform .9s cubic-bezier(.34,1.3,.5,1);stroke:#6B4E33;stroke-width:3;fill:none;stroke-linecap:round}
:root[data-theme="dark"] .c-gate .leaf{stroke:#C9A47A}
.c-gate .open .leaf{transform:perspective(60px) rotateY(-68deg)}
.c-gate .flow{opacity:0;fill:none;stroke:var(--c-blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 8;animation:fpl 1s linear infinite}
.c-gate .open .flow{opacity:1}
.c-gate b{font-size:11.5px;font-weight:700;color:var(--ci2);white-space:nowrap}
.c-gate .open b{color:var(--c-blue)}
/* environment: barn in the snow */
.c-env svg{width:100%;height:100%}
.c-env .snow{position:absolute;top:-6px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.9;animation:snow linear infinite;box-shadow:0 0 2px rgba(80,110,140,.5)}
@keyframes snow{to{transform:translate(var(--dx,-20px),calc(100cqh + 12px))}}
.c-env .wind{fill:none;stroke:rgba(110,140,170,.55);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:18 140;animation:wind 3.2s linear infinite}
:root[data-theme="dark"] .c-env .wind{stroke:rgba(170,200,235,.35)}
@keyframes wind{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
.c-env .tchip{font:800 15px "Golos Text",system-ui,sans-serif}
/* feed: bales left */
.c-feed{padding:12px 12px 46px}
.c-feed svg{width:100%;height:100%;overflow:visible}
.c-feed .bale{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%;cursor:help}
.c-feed .bale:hover{transform:translateY(-3px)}
.c-feed .bale rect{fill:#E3B94F;stroke:#A9802A;stroke-width:1.2}
.c-feed .bale path{stroke:#B48B32;stroke-width:1;fill:none;opacity:.8}
.c-feed .bale.used rect{fill:none;stroke:rgba(120,95,40,.45);stroke-dasharray:3 3} .c-feed .bale.used path{display:none}
:root[data-theme="dark"] .c-feed .bale.used rect{stroke:rgba(230,200,130,.3)}
.pnl.warn .c-feed .bale:not(.used) rect{fill:#E9A53A} .pnl.alarm .c-feed .bale:not(.used) rect{fill:#E07A5F;stroke:#A9442E}
/* camera: one big live feed + who else is recording */
.c-cam{position:absolute;inset:0;display:flex;gap:10px;padding:10px}
.c-cam .cmain{position:relative;flex:1;min-width:0;border-radius:12px;overflow:hidden;background:#000}
.c-cam .cmain svg{position:absolute;inset:0;width:100%;height:100%}
.c-cam .cmain .scan2{position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(160,255,200,.06),transparent);animation:scan2 3.5s linear infinite}
@keyframes scan2{from{top:-30%}to{top:100%}}
.c-cam .cmain em{position:absolute;left:10px;top:9px;font:700 11px var(--mono);color:#fff;font-style:normal;display:flex;align-items:center;gap:6px;letter-spacing:.06em}
.c-cam .cmain em::before{content:"";width:8px;height:8px;border-radius:50%;background:#E5483B;animation:blink 1s steps(2,start) infinite}
.c-cam .cmain .nm{position:absolute;left:10px;bottom:9px;font:600 12px var(--mono);color:#E4F0E8;text-shadow:0 1px 2px #000}
.c-cam .cmain time{position:absolute;right:46px;top:9px;font:600 11px var(--mono);color:#CFE3D6}
.c-cam .cmain.fade{animation:camIn .5s ease}
@keyframes camIn{from{opacity:.2;filter:blur(4px)}}
.c-cam ul{list-style:none;margin:0;padding:0;width:38%;max-width:240px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.c-cam li{display:flex;align-items:center;gap:8px;padding:5px;border-radius:10px;cursor:pointer;color:#DCE7E0;min-height:0;transition:background .2s}
.c-cam li:hover,.c-cam li.on{background:rgba(255,255,255,.08)}
.c-cam li .th{flex:none;width:44px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;position:relative}
.c-cam li .th svg{width:100%;height:100%;display:block}
.c-cam li .tx{min-width:0;font-size:12px;line-height:1.25} .c-cam li .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cam li .tx small{display:flex;align-items:center;gap:5px;color:#8FA59A;font-size:11px}
.c-cam li .tx small::before{content:"";width:6px;height:6px;border-radius:50%;background:#E5483B}
.c-cam li.wolf .tx small{color:#FF8A7E;font-weight:700}
.c-cam li.more{color:#8FA59A;font-size:12px;padding-left:10px;cursor:default} .c-cam li.more:hover{background:none}
body .ggrid .pnl[data-id="camera"] .cap{right:auto;max-width:56%}
@container (max-width:330px){ .c-cam ul{display:none} }
/* gps: real satellite map with the herds on it */
.c-gps{position:absolute;inset:0}
.c-gps svg{width:100%;height:100%;display:block}
.c-gps .hd circle{stroke:#fff;stroke-width:3}
.c-gps .pin{cursor:help}
.c-gps .live{fill:none;stroke:#fff;stroke-width:3;animation:liv 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes liv{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}
body .ggrid .pnl[data-id="gps"]{--ci:#fff;--chip:rgba(10,16,24,.6)}
/* registry: the herd itself, one icon = 20 head */
.c-reg{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:14px 14px 48px;gap:10px}
.c-reg .lg{display:flex;flex-wrap:wrap;gap:6px}
.c-reg .lg button{all:unset;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.55);font:700 12px "Golos Text",system-ui,sans-serif;color:var(--ci);cursor:pointer}
:root[data-theme="dark"] .c-reg .lg button{background:rgba(255,255,255,.08)}
.c-reg .lg i{width:8px;height:8px;border-radius:50%}
.c-reg .herd{flex:1;min-height:0;display:grid;grid-template-columns:repeat(13,1fr);align-content:center;gap:2px 3px}
.c-reg .herd svg{width:100%;height:auto;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s,transform .25s;animation:hlFade .4s ease-out both}
.c-reg.hl .herd svg{opacity:.18} .c-reg.hl .herd svg.on{opacity:1;transform:scale(1.15)}
/* drone: orbit */
.c-drone{flex-direction:column;gap:8px;padding:8px 8px 56px}
.pnl.off .cap{display:none}
.c-drone .orb{position:relative;width:min(52cqh,62cqw);aspect-ratio:1}
.c-drone .orb>svg{position:absolute;inset:0;width:100%;height:100%}
.c-drone .ring{fill:none;stroke:var(--ci2);stroke-width:1;stroke-dasharray:3 5}
.c-drone .sat{animation:orbit 9s linear infinite;transform-origin:50px 50px}
@keyframes orbit{to{transform:rotate(360deg)}}
.c-drone .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50px 50px} @keyframes bob{50%{transform:translateY(-4px)}}
.c-drone .prop{animation:orbit .25s linear infinite;transform-box:fill-box;transform-origin:center}
.c-drone button{border:0;background:var(--ci);color:var(--g-panel,#fff);font:700 13px "Golos Text",system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
body .ggrid .pnl.dk .c-drone button{background:#F2F4F7;color:#0C110F}
@media (max-width:720px){
  body .ggrid .pnl .cap{left:8px;bottom:8px;right:34px} body .ggrid .pnl .cap .line{font-size:11px;padding:4px 8px}
  .c-water .pct{left:10px;top:10px} .c-gate{padding:8px 4px 34px} .c-gate b{display:none}
  .c-cam .cmain .nm,.c-cam .cmain time{display:none}
  .c-reg{padding:8px 8px 34px} .c-reg .lg{display:none} .c-feed{padding:6px 6px 32px} .c-cam{padding:6px}
}
/* v3: gate ring, fence voltage, env chart, feed planner, registry explorer */
.c-g3,.c-e3,.c-f3,.c-r3{position:absolute;inset:0;display:flex;padding:14px 14px 50px;gap:12px;color:var(--ci)}
.ix-tabs{display:flex;gap:4px;flex-wrap:wrap}
.ix-tabs button{all:unset;cursor:pointer;padding:5px 10px;border-radius:999px;font:700 12px "Golos Text",system-ui,sans-serif;color:var(--ci2);background:rgba(255,255,255,.45);transition:background .2s,color .2s}
:root[data-theme="dark"] .ix-tabs button{background:rgba(255,255,255,.07)}
.ix-tabs button[aria-pressed="true"]{background:#1F5A43;color:#fff}
:root[data-theme="dark"] .ix-tabs button[aria-pressed="true"]{background:#F2F4F7;color:#0E1726}
.ix-tabs button:focus-visible{outline:2px solid var(--ci)}
/* gates as a ring: works for 3 or 30 gates */
.c-g3{align-items:center}
.c-g3 .ring{position:relative;height:100%;aspect-ratio:1;max-width:58%;flex:none}
.c-g3 .ring svg{width:100%;height:100%;overflow:visible}
.c-g3 .gs{fill:none;stroke-width:11;stroke:color-mix(in srgb,var(--ci) 22%,transparent);cursor:pointer;transition:stroke .3s,stroke-width .2s}
.c-g3 .gs.open{stroke:var(--c-blue)} .c-g3 .gs.sel{stroke-width:15}
.c-g3 .ctr{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.c-g3 .ctr svg{width:58%;height:auto;overflow:visible}
.c-g3 .ctr b{font-size:11.5px;font-weight:700;line-height:1.1;margin-top:2px;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-g3 .ctr small{font-size:10.5px;color:var(--ci2);font-weight:600}
.c-g3 .ctr.open small{color:var(--c-blue)}
.c-g3 .post{fill:#7A5B3E} :root[data-theme="dark"] .c-g3 .post{fill:#B08A62}
.c-g3 .leaf{transform-box:fill-box;transform-origin:0 50%;transition:transform .9s cubic-bezier(.34,1.3,.5,1);stroke:#6B4E33;stroke-width:3;fill:none;stroke-linecap:round}
:root[data-theme="dark"] .c-g3 .leaf{stroke:#C9A47A}
.c-g3 .ctr.open .leaf{transform:perspective(60px) rotateY(-68deg)}
.c-g3 .flowc{flex:1;min-width:0;padding-top:24px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.c-g3 .fl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ci2)}
.c-g3 .fl b{font-size:17px;color:var(--ci);font-variant-numeric:tabular-nums}
.c-g3 .fl{white-space:nowrap}
.c-g3 .fl i{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:13px;background:color-mix(in srgb,var(--ci) 10%,transparent)}
.c-g3 .lg2{font-size:11.5px;color:var(--ci2);display:flex;gap:10px;flex-wrap:wrap}
.c-g3 .lg2 span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c-blue)} .c-g3 .lg2 span.c::before{background:color-mix(in srgb,var(--ci) 30%,transparent)}
/* fence voltage readout in the middle */
.c-fence .kv{font:800 40px "Golos Text",system-ui,sans-serif;fill:#F2F4F7;letter-spacing:-1px}
.c-fence .kv.bad{fill:#FF6B5E}
.c-fence .kvu{font:700 14px "Golos Text",system-ui,sans-serif;fill:rgba(242,244,247,.7)}
.c-fence .osc{fill:none;stroke:#FFE07A;stroke-width:2;stroke-linejoin:round;stroke-dasharray:240;animation:osc 1.6s linear infinite}
@keyframes osc{from{stroke-dashoffset:240}to{stroke-dashoffset:-240}}
/* env: 24 h + forecast chart with a scrubber */
.c-e3{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;padding-bottom:46px}
.c-e3 .etop{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-right:34px}
.c-e3 .now{font:800 22px "Golos Text",system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap} .c-e3 .now small{font:600 11px "Golos Text",system-ui,sans-serif;color:var(--ci2);margin-left:4px}
.c-e3 .ch{position:relative;flex:1;min-height:0;cursor:crosshair}
.c-e3 .ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c-e3 .l1{fill:none;stroke:#E8955A;stroke-width:2.4;vector-effect:non-scaling-stroke}
.c-e3 .l2{fill:none;stroke:#5F9BE0;stroke-width:2.4;vector-effect:non-scaling-stroke}
.c-e3 .fc{stroke-dasharray:5 4}
.c-e3 .a1{fill:url(#eGrad);opacity:.35}
.c-e3 .storm{fill:color-mix(in srgb,var(--c-amber) 22%,transparent)}
.c-e3 .nowl,.c-e3 .xh{stroke:var(--ci2);stroke-width:1;vector-effect:non-scaling-stroke}
.c-e3 .xh{stroke:var(--ci);opacity:0}
.c-e3 .ax{position:absolute;left:0;right:0;bottom:-15px;display:flex;justify-content:space-between;font:600 10px var(--mono);color:var(--ci2);pointer-events:none}
.c-e3 .dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:2px solid var(--g-panel,#fff);opacity:0;pointer-events:none}
.c-e3 .snow{opacity:.5}
/* feed: drag to a target day */
.c-f3{flex-direction:column;gap:8px;padding-bottom:46px}
.c-f3 .hd{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-right:34px}

.c-f3 .hd b{white-space:nowrap;font:800 24px "Golos Text",system-ui,sans-serif;letter-spacing:-.02em} .c-f3 .hd b small{font-size:12px;font-weight:600;color:var(--ci2);margin-left:3px}
.c-f3 .hd span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.55);white-space:nowrap}
:root[data-theme="dark"] .c-f3 .hd span{background:rgba(255,255,255,.08)}
.c-f3 .hd span.short{background:var(--c-red);color:#fff}
.c-f3 .tl{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(30,1fr);gap:2px;align-items:end;cursor:ew-resize;touch-action:none}
.c-f3 .tl i{display:block;border-radius:3px;height:58%;background:#E3B94F;box-shadow:inset 0 -3px 0 rgba(150,105,30,.35);transition:height .25s,background .2s,opacity .2s}
.c-f3 .tl i:nth-child(odd){height:64%}
.c-f3 .tl i.gone{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(150,115,45,.4)}
:root[data-theme="dark"] .c-f3 .tl i.gone{box-shadow:inset 0 0 0 1.5px rgba(230,200,130,.28)}
.c-f3 .tl i.in{height:86%} .c-f3 .tl i.in.gone{background:color-mix(in srgb,var(--c-red) 35%,transparent);box-shadow:inset 0 0 0 1.5px var(--c-red)}
.c-f3 .tl i.out{opacity:.45}
.c-f3 .tl .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--ci);border-radius:2px;pointer-events:none;transition:left .15s}
.c-f3 .tl .tgt::before{content:"";position:absolute;top:-4px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--ci)}
.c-f3 .ax{display:flex;justify-content:space-between;font:600 10px var(--mono);color:var(--ci2)}
/* registry explorer */
.c-r3{flex-direction:column;gap:8px;padding-bottom:46px}
.c-r3 .ix-tabs{flex-wrap:nowrap;padding-right:34px}
.c-r3 .ix-tabs button{display:inline-flex;align-items:center;gap:5px;padding:4px 7px}

.c-r3 .ix-tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-r3 .bd{flex:1;min-height:0;display:flex;align-items:center;gap:14px}
.c-r3 .big{flex:none;height:100%;max-height:120px;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.45);animation:popIn .45s cubic-bezier(.34,1.42,.5,1)}
:root[data-theme="dark"] .c-r3 .big{background:rgba(255,255,255,.06)}
.c-r3 .big svg{width:70%;height:70%;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.c-r3 .nums{flex:1;min-width:0}
.c-r3 .nums b{display:block;font:800 clamp(30px,13cqw,46px) "Golos Text",system-ui,sans-serif;letter-spacing:-.03em;line-height:1}
.c-r3 .nums b small{font-size:12px;font-weight:600;color:var(--ci2);margin-left:4px;letter-spacing:0}
.c-r3 .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;gap:2px}
.c-r3 .bar i{display:block;height:100%;transform-origin:left;animation:grow .6s cubic-bezier(.22,.9,.22,1) both;cursor:help}
@keyframes grow{from{transform:scaleX(0)}}
.c-r3 .bl{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ci2);font-weight:600}
.c-r3 .bl span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
@container (max-width:240px){ .c-g3 .flowc{display:none} .c-g3 .ring{max-width:100%;margin:0 auto} .c-r3 .big{display:none} .c-e3 .now small{display:none} }
@container (max-height:150px){ .c-r3 .bl{display:none} }
@media (max-width:720px){ .c-g3,.c-e3,.c-f3,.c-r3{padding:8px 8px 34px;gap:6px} .c-e3 .etop .ix-tabs,.c-r3 .ix-tabs button span{display:none} .c-f3 .hd span{display:none} .c-r3 .nums b{font-size:22px} }
@media (prefers-reduced-motion:reduce){ .c-water .bub,.c-env .snow,.c-env .wind,.c-fence .fpl,.c-gate .flow,.c-cam .scan2,.c-drone *,.c-gps .live{animation:none !important} }

/* ===== card content entrance (runs each time Самбар opens) ===== */
@keyframes hlDraw{from{stroke-dasharray:100 100;stroke-dashoffset:100}to{stroke-dasharray:100 100;stroke-dashoffset:0}}
@keyframes hlUp{from{transform:scaleY(0)}}
@keyframes hlPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes hlSlide{from{opacity:0;transform:translateX(18px)}}
@keyframes hlBlur{from{opacity:0;filter:blur(10px);transform:scale(1.06)}}
@keyframes hlFadeIn{from{opacity:0}}
@keyframes hlDrop{from{opacity:0;transform:translateY(-40px)}}
.gridview.enter .ggrid .pnl{--d:calc(var(--i,0) * 45ms + 250ms)}

<script>
(function(){
"use strict";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow = () => innerWidth <= 720;

/* ---------- module data ---------- */
const MODULES = [
  {id:'drone', name:'Дрон', grid:[0,0], status:'off', metric:'Идэвхжүүлээгүй'},
  {id:'camera', name:'Камер', grid:[1,0], status:'ok', metric:'3/3 бичиж байна'},
  {id:'water', name:'Усны сав', grid:[2,0], status:'warn', metric:'34%'},
  {id:'fence', name:'Цахилгаан хашаа', grid:[0,1], status:'alarm', metric:'3-р хэсэг тасарсан'},
  {id:'registry', name:'Малын бүртгэл', grid:[1,1], status:'ok', metric:'1 284 толгой'},
  {id:'env', name:'Хашааны орчин', grid:[2,1], status:'ok', metric:'−2°C'},
  {id:'gate', name:'Хаалга', grid:[0,2], status:'ok', metric:'Хаалттай'},
  {id:'gps', name:'Малын байршил', grid:[1,2], status:'ok', metric:'312/312 хашаанд'},
  {id:'feed', name:'Тэжээлийн нөөц', grid:[2,2], status:'ok', metric:'Өвс 18 хоног'}
];
const STATUS_TEXT = {ok:'Хэвийн', warn:'Анхааруулга', alarm:'Аюул', off:'Идэвхжүүлээгүй'};
const STATUS_DOT = {ok:'var(--ok)', warn:'var(--warn)', alarm:'var(--alarm)', off:'var(--off)'};

/* ---------- live state: everything below reads from here ---------- */
const ST = {waterLevel:0.72, waterTemp:4.2, hayTotalDays:40, fenceFault:false, wolf:false, hayDays:18, since:{}, ack:{}};
MODULES.forEach(m=>{ m.base=m.status; m.baseMetric=m.metric; });
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* thresholds are user settings; numbers are turned into plain words before they reach the screen */
const TH={wWarn:35,wAlarm:12,hWarn:8,hAlarm:4,fMin:4,tMin:-15};
let ROLE='owner';
const USE_PER_H=4.1/24;
const waterHours=()=>ST.waterLevel*20/USE_PER_H;
function fmtDur(h){ if(h<1) return '1 цагаас бага'; if(h<36) return `≈ ${Math.round(h)} цаг`; return `≈ ${Math.round(h/24)} хоног`; }
function untilTx(h){ const now=new Date(), d=new Date(now.getTime()+h*3600e3); const tm=new Date(now.getTime()+864e5);
  const day=d.toDateString()===now.toDateString()?'өнөөдөр':d.toDateString()===tm.toDateString()?'маргааш':`${d.getMonth()+1}-р сарын ${d.getDate()}`; return `${day} ${hhmm(d)}`; }
const FENCE_PLACE='Урд хашаа, худгийн ард';
function stormHours(){ const d=new Date(), t=new Date(d); t.setDate(d.getDate()+1); t.setHours(14,0,0,0); return Math.max(0,Math.round((t-d)/3600e3)); }
const offAgo=()=>ST.offSince?Math.max(1,Math.round((Date.now()-ST.offSince)/60000)):0;
function evalModule(id){
  switch(id){
    case 'water': { const pct=Math.round(ST.waterLevel*100), m3=(ST.waterLevel*20).toFixed(1);
      if(pct<TH.wAlarm) return {s:'alarm',m:'Ус дуусч байна',pct,m3};
      if(pct<TH.wWarn) return {s:'warn',m:`${fmtDur(waterHours())} хүрнэ`,pct,m3};
      return {s:'ok',m:pct+'%',pct,m3}; }
    case 'fence': return ST.fenceFault?{s:'alarm',m:'Урд хашаа тасарсан'}:{s:'ok',m:'8.2 кВ'};
    case 'camera': return ST.wolf?{s:'alarm',m:'Чоно илэрлээ'}:{s:'ok',m:'3/3 бичиж байна'};
    case 'drone': return ST.droneOn?{s:'ok',m:'Бааз дээр, 96%'}:{s:'off',m:'Идэвхжүүлээгүй'};
    case 'feed': { const d=ST.hayDays, m=`Өвс ${d} хоног`; return d<TH.hAlarm?{s:'alarm',m}:d<TH.hWarn?{s:'warn',m}:{s:'ok',m}; }
  }
  const m=MODULES.find(x=>x.id===id); return {s:m.base,m:m.baseMetric};
}
const ALERT_TEXT = {
  water:{alarm:['Усны сав хоосорлоо','Түвшин {pct}%, малд ≈ 4 цагийн ус үлдлээ'], warn:['Усны түвшин буурч байна','Түвшин {pct}%']},
  fence:{alarm:['Цахилгаан хашаа тасарлаа','3-р хэсэг, хүчдэл 0 кВ']},
  camera:{alarm:['Камерт чоно илэрлээ','Камер 2, өвөлжөөний баруун тал']},
  feed:{alarm:['Өвсний нөөц дуусах дөхлөө','{d} хоногийн нөөц үлдлээ'], warn:['Өвсний нөөц багасаж байна','{d} хоногийн нөөц үлдлээ']}
};
let newAlarms=[];
function evalAll(){ newAlarms=[];
  MODULES.forEach(m=>{ const r=evalModule(m.id), prev=m.status; m.status=r.s; m.metric=(m.id==='gate'&&m.liveMetric)||r.m; m.info=r;
    if((r.s==='alarm'||r.s==='warn') && r.s!==prev){ ST.since[m.id]=new Date(); ST.ack[m.id]=false; if(r.s==='alarm') newAlarms.push(m.id); }
    if(r.s==='ok'||r.s==='off'){ delete ST.since[m.id]; delete ST.ack[m.id]; } }); }
function alertFor(m){ if(m.status!=='alarm'&&m.status!=='warn') return null; const h=waterHours(); let t=null;
  if(m.id==='water') t=m.status==='alarm'?['Усны сав хоосорч байна',`Малд ${fmtDur(h)} хүрэх ус үлдлээ, ${untilTx(h)} гэхэд дуусна`]:['Ус удахгүй дуусна',`${untilTx(h)} гэхэд дуусна, одоо ${m.info.pct}%`];
  if(m.id==='fence') t=['Цахилгаан хашаа тасарлаа',`${FENCE_PLACE}, тэр хэсэгт гүйдэл алга`];
  if(m.id==='camera') t=['Камерт чоно илэрлээ','Камер 2, өвөлжөөний баруун тал, хоньдоос ≈ 120 м'];
  if(m.id==='feed') t=m.status==='alarm'?['Өвс дуусах дөхлөө',`${ST.hayDays} хоногийн өвс үлдлээ, шуурганаас өмнө захиална уу`]:['Өвсний нөөц багасаж байна',`${ST.hayDays} хоногийн өвс үлдлээ`];
  if(!t) return null; return {title:t[0], sub:t[1], time:hhmm(ST.since[m.id]||new Date())}; }
function activeAlerts(){ return MODULES.filter(m=>m.status==='alarm'||m.status==='warn').sort((a,b)=>(a.status==='alarm'?0:1)-(b.status==='alarm'?0:1)).map(m=>({m,a:alertFor(m)})).filter(x=>x.a); }
const AI_HINT={water:'Ус ≈ 4 цагт дуусна. Шуурга эхлэхээс өмнө дүүргэх хэрэгтэй, насосыг алсаас асааж болно.',
  fence:'Урд хашаа худгийн ард тасарсан. Тэр хэсэгт хамгийн ойр 46 хонь бэлчиж байна, сүргийг өвөлжөө рүү ойртуулах нь зөв.',
  camera:'Чоно хоньдоос ≈ 120 м зайд байна. Хашааны гэрэл, дуут дохиог асаахыг санал болгож байна.',
  feed:'Өвс цөөн хоногт дуусна. Шуурганаас болж тээвэр саатаж болзошгүй тул өнөөдөр захиалах нь зөв.'};
evalAll();

function spark(values, cls){
  const w=300,h=64,min=Math.min(...values),max=Math.max(...values);
  const pts=values.map((v,i)=>[i*(w/(values.length-1)), h-6-((v-min)/(max-min||1))*(h-14)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col = cls==='warn'?'var(--warn)':'var(--forest)';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function rows(list){return '<dl class="rows">'+list.map(r=>`<div class="row"><dt>${r[0]}</dt><dd class="${r[2]||''}">${r[1]}</dd></div>`).join('')+'</dl>';}

const DETAIL = {
  water:()=>{ const r=evalModule('water'), days=(ST.waterLevel*20/4.1).toFixed(1), cls=r.s==='ok'?'':r.s;
    const wh=waterHours(); const lead = r.s==='alarm'?`Савны ус бараг дууссан. Малд ${fmtDur(wh)} хүрэх ус үлдсэн тул яаралтай дүүргэнэ үү.`:r.s==='warn'?`Одоогийн хэрэглээгээр ${untilTx(wh)} гэхэд дуусна.`:`Хангалттай. ${fmtDur(wh)} хүрнэ.`;
    const series=Array.from({length:24},(_,i)=>r.pct+(23-i)*1.1);
    return {lead, body: rows([['Түвшин',`${r.pct}% (${r.m3} / 20 м³)`,cls],['Өнөөдөр хэрэглэсэн','4.1 м³'],['Хүрэх хугацаа',`${fmtDur(wh)}, ${untilTx(wh)} хүртэл`,cls],['Насос','Унтраалттай']])+
      `<div class="spark"><small>Сүүлийн 24 цаг</small>${spark(series,cls?'warn':'')}</div>`, action:'Усны савны хуудас нээх'}; },
  fence:()=> ST.fenceFault ? ({lead:'Урд хашааны утас худгийн ард тасарсан. Тэндээс цааш гүйдэл очихгүй байна.',
      body: rows([['Энергизатор','8.2 кВ'],['Тасарсан газар','Урд хашаа, худгийн ард','alarm'],['Гэмтэл гарсан',`Өнөөдөр ${hhmm(ST.since.fence||new Date())}`,'alarm'],['Нийт урт','1.8 км, 9 шон']]), action:'Цахилгаан хашааны хуудас нээх'})
    : ({lead:'Бүх хэсэгт хүчдэл хэвийн.', body: rows([['Энергизатор','8.2 кВ'],['Хамгийн сул цэг','6.9 кВ, 5-р хэсэг'],['Сүүлийн гэмтэл','10-р сарын 12'],['Нийт урт','1.8 км, 9 шон']]), action:'Цахилгаан хашааны хуудас нээх'}),
  gate:()=>({lead:'Хаалгаар орж гарсан мал бүрийг RFID-аар бүртгэнэ.',
    body: rows([['Одоо',gateState.open?'Нээлттэй':'Хаалттай'],['Өнөөдөр орсон','146 толгой'],['Өнөөдөр гарсан','151 толгой'],['Сүүлд','Хонь 496 0001 2384, 15:58']]),
    action:'Хаалганы хуудас нээх'}),
  camera:()=> ST.wolf ? ({lead:'Камер 2 өвөлжөөний баруун талд чоно илрүүллээ. Илрэх үеийн бичлэгийг тусад нь хадгалсан.',
      body: rows([['Илэрсэн','Чоно, 1','alarm'],['Байршил','Камер 2, баруун тал'],['Хоньдоос зай','≈ 120 м','alarm'],['Илэрсэн цаг',hhmm(ST.since.camera||new Date())]]), action:'Шууд дүрс үзэх'})
    : ({lead:'Бүх камер онлайн, тасралтгүй бичиж байна.',
      body: rows([['Камер','3, бүгд онлайн'],['Бичлэг хадгалах','7 хоног'],['Чоно, хүн илрүүлэлт','24 цагт илрээгүй'],['Төллөх шинжтэй','Хонь 1, хашаанд']]), action:'Камерын хуудас нээх'}),
  registry:()=>({lead:'Эзэмшиж буй төрлүүд л харагдана. RFID, QR, зүс, удмаар хайна.',
    body: rows([['Нийт','1 284 толгой'],['Хонь','812'],['Ямаа','356'],['Үхэр','74'],['Адуу','42'],['Сүүлд бүртгэсэн','10-р сарын 18']]),
    action:'Малын бүртгэл нээх'}),
  env:()=>({lead:'Хашаан доторх орчин хэвийн. Маргаашийн шуурганаас өмнө саравчны хаалтыг шалгаарай.',
    body: rows([['Хашаан дотор','−2°C'],['Гадна','−6°C'],['Чийгшил','68%'],['Салхи','6 м/с']])+
    `<div class="spark"><small>Хашаан доторх хэм, 24 цаг</small>${spark([-1,-1.5,-2,-3,-4,-4.5,-5,-4.8,-4,-3,-1.5,0,1,2,2.5,2,1.5,0.5,0,-0.5,-1,-1.5,-2,-2])}</div>`,
    action:'Орчны хуудас нээх'}),
  gps:()=>({lead:'Хүзүүвчтэй бүх мал хашааны хүрээнд байна.',
    body: rows([['Хүзүүвчтэй','312 толгой'],['Хашааны хүрээнд','312'],['Хамгийн хол','Өвөлжөөнөөс 1.9 км'],['Сүүлд шинэчилсэн','2 минутын өмнө']]),
    action:'Малын байршил нээх'}),
  feed:()=>{ const r=evalModule('feed'), cls=r.s==='ok'?'':r.s, tn=(ST.hayDays*0.76).toFixed(1);
    return {lead: r.s==='ok'?'Өвс, тэжээлийн нөөц хэвийн.':`Өвсний нөөц ${ST.hayDays} хоногт дуусна. Маргаашийн шуурганаас өмнө нөөцөө нэмэх хэрэгтэй.`,
      body: rows([['Өвсний нөөц',`${tn} т, ≈ ${ST.hayDays} хоног`,cls],['Тэжээл','640 кг'],['Өнөөдөр жинлэсэн','38 толгой'],['Дундаж жин','48.6 кг']])+
      `<div class="spark"><small>Хонины дундаж жин, 12 долоо хоног</small>${spark([41.2,42,42.6,43.5,44.1,45,45.4,46.3,47,47.5,48.1,48.6])}</div>`,
      action:'Тэжээлийн нөөц нээх'}; },
  drone:()=>({lead:'Энэ модулийг идэвхжүүлээгүй байна. Дроноор бэлчээр, сүргийг агаараас шалгаж, төөрсөн малыг хайна.',
    body: rows([['Төлөв','Идэвхжүүлээгүй'],['Шаардлагатай','Дрон, буух талбай']]),
    action:'Идэвхжүүлэх'}),
  ai:()=>{ const list=activeAlerts();
    const notes = list.length ? list.map(({m})=>`<div class="note"><b>${m.name}</b>${AI_HINT[m.id]||''}</div>`).join('')
      : `<div class="note"><b>Өнөөдөр</b>Анхаарах зүйл алга. Ус ${Math.round(ST.waterLevel*100)}%, өвс ${ST.hayDays} хоногийн нөөцтэй. Маргаашийн шуурганаас өмнө малаа үдээс өмнө хашаалаарай.</div>`;
    return {lead:'Модулиудын мэдээллийг хооронд нь холбож дүгнэнэ.', body: notes+`<div class="chips"><button>Өвс хэд хоног хүрэх вэ?</button><button>Энэ сард хэдэн мал жин нэмсэн бэ?</button></div>
      <div class="ask"><input type="text" placeholder="Асуулт бичих" aria-label="Туслахаас асуух"></div>`, action:'Туслах нээх', title:'Туслах', status:'ok'}; },
  weather:()=>({lead:'Маргааш 14:00-с цасан шуурга, салхи 18 м/с хүрнэ. Малаа үдээс өмнө хашаалаарай.',
    body: rows([['Одоо','−6°C, үүлэрхэг'],['Салхи','6 м/с, баруун хойноос'],['Шөнө','−14°C']])+
    `<div class="fc"><div>Маргааш<strong>−9°</strong></div><div class="w">Шуурга<strong>18 м/с</strong></div><div>Пүрэв<strong>−12°</strong></div></div>`,
    action:'Цаг агаарын хуудас нээх', title:'Цаг агаар', status:'warn'})
};

/* ---------- three.js setup ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10,10,10,-10,0.1,200);
const CAM_DIR = new THREE.Vector3(1,1,1).normalize();
const camTarget = new THREE.Vector3(0,-0.6,0), camTargetGoal = camTarget.clone();
let zoom = 1, zoomGoal = 1, viewShift = 0, viewShiftGoal = 0, cx = innerWidth/2, cy = innerHeight*0.52;

const hemi = new THREE.HemisphereLight(0xffffff, 0x9c8a6a, 0.62);

/* QR code texture for the ear tag (illustrative pattern) */
function qrTex(){ return canvasTex(256,300,(g,w,h)=>{ const bg='#F7EFD9', ink='#1B1B18'; g.fillStyle=bg; g.fillRect(0,0,w,h);
  const N=25, m=10, cs=(w-2*m)/N, R=rng(2384), fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  g.fillStyle=ink;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(fin(x,y)) continue; const on=(x===6||y===6)?((x+y)%2===0):R()<0.47; if(on) g.fillRect(m+x*cs,m+y*cs,cs+0.6,cs+0.6); }
  [[0,0],[N-7,0],[0,N-7]].forEach(([fx,fy])=>{ g.fillStyle=ink; g.fillRect(m+fx*cs,m+fy*cs,7*cs,7*cs); g.fillStyle=bg; g.fillRect(m+(fx+1)*cs,m+(fy+1)*cs,5*cs,5*cs); g.fillStyle=ink; g.fillRect(m+(fx+2)*cs,m+(fy+2)*cs,3*cs,3*cs); });
  g.fillStyle=ink; g.font='bold 34px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('2384',w/2,h-24); }); }

/* ---------- day / night ---------- */
let phaseMode='auto', phase='day';
function computePhase(){ const h=new Date().getHours(); if(h>=20||h<6) return 'night'; if(h>=18) return 'dusk'; if(h<8) return 'dusk'; return 'day'; }
function applyPhase(){
  phase = phaseMode==='auto'?computePhase():phaseMode;
  const root=document.documentElement; root.dataset.phase=phase; root.dataset.theme = phase==='night'?'dark':'light';
  if(!/pal-[a-n]/.test(location.hash)) root.dataset.pal = phase==='night'?'n':'b';
  const night=phase==='night', dusk=phase==='dusk';
  sun.visible=!night; moon.visible=night;
  hemi.intensity = night?0.3:dusk?0.55:0.62; hemi.color.set(night?0x9fb3d9:0xffffff); hemi.groundColor.set(night?0x2d2a3a:0x9c8a6a);
  sunLight.intensity = night?0.4:dusk?0.9:1.05; sunLight.color.set(night?0xa9c1ff:dusk?0xffc996:0xfff3e0);
  fill.intensity = night?0.1:0.22;
  MAT.doorGlow.emissiveIntensity = night?1.4:0;
  cloudMat.color.copy(C(night?'#5D6A86':'#FFFFFF'));
}

abBack.addEventListener('click',()=>{ if(!settingsEl.hidden) closeSettings(); else if(!profileEl.hidden) closeProfile(); else if(modOpen) backToDash(); });
let railKey=null, tipT;
function railActive(){ if(!settingsEl.hidden) return 'settings'; if(!profileEl.hidden) return 'profile'; if(modOpen) return modOpen; return document.body.classList.contains('grid')?'grid':'map'; }
function showTip(b,ms){ if(!b||!b.dataset.tip||innerWidth<=720) return; const r=b.getBoundingClientRect(); railTip.textContent=b.dataset.tip;
  railTip.style.top=(r.top+r.height/2)+'px'; railTip.style.left=(r.right+12)+'px'; railTip.classList.add('on'); clearTimeout(tipT); if(ms) tipT=setTimeout(()=>railTip.classList.remove('on'),ms); }
function railSync(){ const k=railActive(), b=railEl.querySelector(`.ri[data-k="${k}"]`); abSync(k);
  railEl.querySelectorAll('.ri').forEach(x=>x.setAttribute('aria-current',String(x===b)));
  document.body.classList.toggle('setopen',!settingsEl.hidden);
  if(b&&b.offsetParent){ railInd.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop}px)`; railInd.style.opacity='1'; } else railInd.style.opacity='0';
  if(k!==railKey){ const first=railKey===null; railKey=k; if(!first&&b) showTip(b,1300); } }
function railStatus(){ MODULES.forEach(m=>{ const b=railEl.querySelector(`.ri[data-k="${m.id}"]`); if(!b) return;
    b.classList.toggle('off',m.status==='off'); b.querySelector('.sd').className='sd '+m.status;
    b.setAttribute('aria-label',`${m.name}: ${STATUS_TEXT[m.status]}`); });
  const night=document.documentElement.dataset.theme==='dark', tb=document.getElementById('abTheme');
  if(tb){ tb.innerHTML=svgI(night?'sun':'moon'); tb.title=night?'Өдрийн горим':'Шөнийн горим'; }
  const pa=railEl.querySelector('.rav'); if(pa){ pa.textContent=pfMe().name[0]; pa.classList.toggle('v',ROLE!=='owner'); } }
function leaveOverlays(){ if(!settingsEl.hidden) closeSettings(); if(!profileEl.hidden) closeProfile(); if(modOpen) backToDash(); }
railEl.addEventListener('click',e=>{ const b=e.target.closest('.ri'); if(!b) return; const k=b.dataset.k;
  if(k==='map'||k==='grid'){ leaveOverlays(); setMode(k==='grid'?'grid':'main'); }
  else if(k==='profile'){ if(profileEl.hidden) openProfile(); else closeProfile(); }
  else if(k==='settings'){ if(settingsEl.hidden){ if(modOpen) backToDash(); openSettings(); } else closeSettings(); }
  else if(k==='theme'){ const r=b.getBoundingClientRect(); toggleTheme(r.left+r.width/2,r.top+r.height/2); }
  else { if(!settingsEl.hidden) closeSettings(); if(!profileEl.hidden) closeProfile(); const from=modOpen?null:document.querySelector(mode==='grid'?`.pnl[data-id="${k}"]`:`.tag[data-id="${k}"]`); openOr(k,from); }
  railSync(); });
railEl.addEventListener('pointerover',e=>{ const b=e.target.closest('.ri'); if(b) showTip(b); });
railEl.addEventListener('focusin',e=>{ const b=e.target.closest('.ri'); if(b) showTip(b); });
railEl.addEventListener('pointerleave',()=>{ railTip.classList.remove('on'); railEl.querySelectorAll('.ri svg').forEach(s=>s.style.transform=''); });

/* magnetic dock: icons near the pointer grow, falling off with distance */
if(matchMedia('(pointer:fine)').matches&&!REDUCED) railEl.addEventListener('pointermove',e=>{ if(innerWidth<=720) return;
  railEl.querySelectorAll('.ri').forEach(b=>{ const r=b.getBoundingClientRect(), d=Math.abs(e.clientY-(r.top+r.height/2)), s=1+0.32*Math.max(0,1-d/86);
    b.firstElementChild.style.transform=`scale(${s.toFixed(3)})`; }); });
new MutationObserver(railSync).observe(document.body,{attributes:true,attributeFilter:['class']});
new MutationObserver(railSync).observe(settingsEl,{attributes:true,attributeFilter:['hidden']});
new MutationObserver(railSync).observe(document.getElementById('profile'),{attributes:true,attributeFilter:['hidden']});
new MutationObserver(railSync).observe(document.getElementById('modTitle'),{childList:true});
new MutationObserver(railSync).observe(modwrap,{attributes:true,attributeFilter:['class']});
addEventListener('resize',()=>{ railTip.classList.remove('on'); railSync(); });
{ const _refresh=refresh; refresh=function(){ _refresh(); railStatus(); railSync(); if(!profileEl.hidden&&!pfEdit){ const st=profileEl.scrollTop; renderProfile(); profileEl.scrollTop=st; } }; }
{ const _applyPhase=applyPhase; applyPhase=function(){ _applyPhase(); if(railEl.firstChild) railStatus(); syncFrameTheme(); }; }
/* an open module page follows the dashboard theme live (adapters listen for "hl-theme") */
function syncFrameTheme(){ if(!modOpen) return; try{ const d=modframe.contentDocument, w=modframe.contentWindow; if(!d||!d.documentElement) return;
  const mode=document.documentElement.dataset.theme==='dark'?'dark':'light'; if(d.documentElement.dataset.theme===mode) return;
  d.documentElement.setAttribute('data-theme',mode); const st=d.getElementById('hl-theme'); if(st) st.textContent=thCSS(mode); w.dispatchEvent(new w.Event('hl-theme')); }catch(_){} }

/* theme: the new palette grows out of the button as a circle */
function toggleTheme(x,y){ const night=document.documentElement.dataset.theme==='dark';
  const apply=()=>{ phaseMode=night?'day':'night'; document.querySelectorAll('.seg button').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.phase===phaseMode))); applyPhase(); try{ renderer.render(scene,camera); }catch(_){} };
  if(!document.startViewTransition||REDUCED){ apply(); return; }
  const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},
    {duration:700,easing:'cubic-bezier(.22,.9,.22,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{}); }

/* numbers count up from zero (number roll) */
const NUM_RE=/\d{1,3}(?:[  ]\d{3})+|\d+(?:\.\d+)?/g;
function countUp(el,dur){ if(REDUCED) return; const final=el.textContent, parts=[]; let last=0, any=false;
  final.replace(NUM_RE,(m,off)=>{ parts.push(final.slice(last,off)); const sep=(m.match(/[  ]/)||[''])[0];
    parts.push({v:parseFloat(m.replace(/[  ]/g,'')),dec:sep?0:(m.split('.')[1]||'').length,sep}); last=off+m.length; any=true; return m; });
  if(!any) return; parts.push(final.slice(last)); const t0=performance.now();
  const fmt=(p,k)=>{ const v=p.v*k; return p.sep?Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,p.sep):v.toFixed(p.dec); };
  const step=now=>{ if(!el.isConnected||el.textContent===final&&now>t0+dur) return; const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=parts.map(p=>typeof p==='string'?p:fmt(p,e)).join(''); if(k<1) requestAnimationFrame(step); else el.textContent=final; };
  requestAnimationFrame(step); }
function stagger(list){ list.forEach((el,i)=>el.style.setProperty('--i',i)); }
let enterT;
function gridEnter(){ if(REDUCED) return; gridView.classList.remove('enter'); void gridView.offsetWidth;
  stagger([...gridView.querySelectorAll('.ghd .ttl,.ghd .kpi,.ghd .clock')]); stagger([...gridView.querySelectorAll('.galerts>*')]);
  [...ggrid.querySelectorAll('.pnl')].forEach((p,i)=>p.style.setProperty('--i',i+2));
  gridView.classList.add('enter'); waterLvl=0;
  ggrid.querySelectorAll('.big2,.donut2 text:first-of-type,.c-r3 [data-cu],.c-g3 .fl b').forEach((n,i)=>setTimeout(()=>countUp(n,900),260+i*40));
  const kv=ggrid.querySelector('.c-fence .kv'); if(kv&&kv.firstChild&&kv.firstChild.nodeType===3){ const fin=kv.firstChild.nodeValue, v=parseFloat(fin), t0=performance.now(); (function s(n){ const k=Math.min(1,(n-t0-300)/900); if(k>0) kv.firstChild.nodeValue=(v*(1-Math.pow(1-k,3))).toFixed(1); if(k<1) requestAnimationFrame(s); else kv.firstChild.nodeValue=fin; })(t0); }
  gridView.querySelectorAll('.kpi b').forEach(n=>countUp(n,800));
  clearTimeout(enterT); enterT=setTimeout(()=>gridView.classList.remove('enter'),2600); }
function mainEnter(){ if(REDUCED) return; document.body.classList.remove('mainenter'); void document.body.offsetWidth;
  stagger([...document.querySelectorAll('#labels .tag')]); stagger([...document.querySelectorAll('.brand>*,.srch,.weather')]);
  document.body.classList.add('mainenter'); clearTimeout(enterT); enterT=setTimeout(()=>document.body.classList.remove('mainenter'),1400); }

/* module pages: blocks rise in one after another and line charts draw themselves */
function frameEnter(d){ if(REDUCED||!d||!d.body) return;
  const st=d.createElement('style'); st.textContent='@keyframes hlIn{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(8px)}}.hl-in{animation:hlIn .6s cubic-bezier(.22,.9,.22,1) both}';
  d.head.appendChild(st);
  const cand=[...d.body.querySelectorAll('header,section,article,aside,[class*="card"],[class*="panel"],[class*="tile"],[class*="kpi"],[class*="stat"]')]
    .filter(el=>el.getBoundingClientRect().height>24&&!el.parentElement.closest('header,section,article,aside,[class*="card"],[class*="panel"],[class*="tile"],[class*="kpi"],[class*="stat"]'));
  const blocks=(cand.length>1?cand:[...d.body.children]).slice(0,30);
  blocks.forEach((el,i)=>{ el.style.animationDelay=(i*45)+'ms'; el.classList.add('hl-in'); });
  setTimeout(()=>blocks.forEach(el=>{ el.classList.remove('hl-in'); el.style.animationDelay=''; }),blocks.length*45+900);
  let n=0; d.querySelectorAll('svg path,svg polyline').forEach(p=>{ if(n>=60) return; const cs=d.defaultView.getComputedStyle(p);
    if(cs.fill!=='none'||cs.stroke==='none'||(cs.strokeDasharray&&cs.strokeDasharray!=='none')) return;
    let L=0; try{ L=p.getTotalLength(); }catch(_){ return; } if(L<40||L>5000) return; n++;
    p.animate([{strokeDasharray:`${L} ${L}`,strokeDashoffset:L},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0}],{duration:1100,delay:250+n*30,easing:'cubic-bezier(.4,0,.2,1)',fill:'backwards'}); }); }

/* a module just unlocked: confetti bursts from it */
function confetti(x,y){ if(REDUCED) return; const c=document.createElement('canvas'); c.className='hl-confetti'; c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio;
  document.body.appendChild(c); const g=c.getContext('2d'); g.scale(devicePixelRatio,devicePixelRatio);
  const COL=['#5CC48A','#F2B544','#6AA9FF','#E5483B','#D9A23A','#E9ECF2'];
  const P=Array.from({length:140},()=>{ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3, v=6+Math.random()*9;
    return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:5+Math.random()*5,h:3+Math.random()*4,c:COL[Math.random()*COL.length|0]}; });
  const t0=performance.now(); (function f(now){ const k=(now-t0)/1800; g.clearRect(0,0,innerWidth,innerHeight); g.globalAlpha=Math.max(0,1-k*k);
    P.forEach(p=>{ p.vy+=.32; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if(k<1) requestAnimationFrame(f); else c.remove(); })(t0); }
{ const _droneOn=droneOn; droneOn=function(){ const was=ST.droneOn; _droneOn(); if(was) return;
  const el=document.querySelector('.pnl[data-id="drone"]')||railEl.querySelector('[data-k="drone"]'), r=el.getBoundingClientRect(); confetti(r.left+r.width/2,r.top+r.height/2); }; }

refresh();
